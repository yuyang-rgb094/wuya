[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wuya-agents"
version = "0.1.0"
description = "WuYa (无涯) — A theory-driven multi-agent system for academic paper evaluation and journal recommendation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "WuYa Team"},
]
keywords = ["multi-agent", "academic-review", "paper-evaluation", "journal-recommendation", "LLM", "RAG", "DEA"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "aiohttp>=3.8.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.0.0",
    "anthropic>=0.8.0",
    "tiktoken>=0.5.0",
]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]
rag = [
    "chromadb>=0.4.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]
all = [
    "wuya-agents[llm,server,rag]",
]

[project.scripts]
wuya = "wuya_agents.cli:app"

[project.urls]
Homepage = "https://github.com/wuya-team/wuya"
Documentation = "https://github.com/wuya-team/wuya#readme"
Repository = "https://github.com/wuya-team/wuya"
Issues = "https://github.com/wuya-team/wuya/issues"
Changelog = "https://github.com/wuya-team/wuya/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["wuya_agents*"]

[tool.setuptools.package-data]
wuya_agents = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "e2e: marks end-to-end tests",
]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["wuya_agents"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["scipy.*", "numpy.*", "chromadb.*", "aiohttp.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["wuya_agents"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]
